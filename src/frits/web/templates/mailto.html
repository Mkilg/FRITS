{% extends "base.html" %}
{% block title %}E-Mail · FRITS{% endblock %}
{% block content %}
<h1>E-Mail vorbereiten</h1>
<section class="card">
  <p>Mail ließ sich nicht automatisch öffnen. Mit diesem Link öffnet dein E-Mail-Programm eine fertige Nachricht. Das PDF hängst du selbst an.</p>
  <div class="row">
    <a class="button primary" href="{{ link }}">E-Mail öffnen</a>
    <form method="post" action="/open/invoices"><input type="hidden" name="token" value="{{ token }}"><button>Rechnungsordner öffnen</button></form>
  </div>
</section>
{% endblock %}
