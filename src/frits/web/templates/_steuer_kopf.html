{# Ressourcenleiste der Steuer-Quest: oben auf jeder Quest-Seite #}
<header class="sq-leiste">
  <a class="sq-titel" href="/steuer/{{ jahr }}">Steuer-Quest {{ jahr }}</a>
  <span class="sq-res" title="Gesicherte Dokumente"><b>{{ ressourcen.belege }}</b> Belege</span>
  <span class="sq-res" title="Wünsche deiner Beraterin"><b>{{ ressourcen.briefe }}</b> Briefe</span>
  <span class="sq-res" title="Komplette Provinzen"><b>{{ ressourcen.siegel }}</b> Siegel</span>
  <span class="sq-res" title="Fragen an deine Beraterin"><b>{{ ressourcen.fragen }}</b> Fragen</span>
  <span class="sq-zeitalter">
    <span>{{ zeitalter[1] }}</span>
    <span class="sq-balken" role="progressbar" aria-valuenow="{{ gesamt.prozent }}" aria-valuemin="0" aria-valuemax="100"><span style="width: {{ gesamt.prozent }}%"></span></span>
    <span>{{ gesamt.prozent }} %</span>
  </span>
</header>
