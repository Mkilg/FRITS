# Die Provinzen der Steuer-Quest und was dort gesammelt wird.
#
# Aufbau (siehe Fachkonzept):
#   frage        welche Antwort im Fragebogen die Provinz freischaltet ("immer" = immer dabei)
#   zaehlbar     true: Die Antwort ist eine Anzahl (z. B. Wohnungen), es gibt eine Provinz pro Stück
#   person       true: gehört einer Person (bei gemeinsamer Erklärung: du oder Partner)
#   anlage       das Formular der Steuererklärung, nur als Hinweis
#   woerter      helfen beim Zuordnen von Wünschen der Beraterin
#
# Jedes Stück ist "pflicht" (Einnahmen und ihre Belege: das sind die Lebenspunkte des
# Drachen) oder "bonus" (Ausgaben, die Steuern sparen können: Extra-Beute, nie Pflicht).
# Ein Stück mit `wenn` erscheint nur, wenn diese Antwort im Fragebogen angekreuzt ist.
#
# Das ist eine Sammelhilfe, keine Steuerberatung. Ergänzen ist ausdrücklich erwünscht.

[[provinz]]
key = "rathaus"
name = "Rathaus"
bereich = "Persönliches und Finanzamt"
frage = "immer"
anlage = "Hauptvordruck"
woerter = ["finanzamt", "bescheid", "vorauszahlung", "steuer-id", "identifikationsnummer", "steuernummer"]
stuecke = [
  { key = "steuer-id", kern = true, name = "Steuer-ID", hinweis = "Steht auf jedem Steuerbescheid und auf der Lohnsteuerbescheinigung." },
  { key = "bescheid", name = "Letzter Steuerbescheid", hinweis = "Der Bescheid vom Vorjahr hilft der Beraterin beim Vergleich." },
  { key = "vorauszahlungen", name = "Vorauszahlungsbescheide", hinweis = "Nur wenn du Steuern vorab zahlst." },
  { key = "briefe", name = "Weitere Briefe vom Finanzamt", hinweis = "Alles, was das Finanzamt dieses Jahr geschickt hat." },
  { key = "kirchensteuer", name = "Gezahlte Kirchensteuer", hinweis = "Nur wenn du sie selbst gezahlt hast.", art = "bonus", wenn = "kirche" },
]

