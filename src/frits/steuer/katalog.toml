# Die Provinzen der Steuer-Quest und was dort typischerweise gesammelt wird.
#
# Jede [[provinz]] gehört zu einer Frage im Fragebogen (`frage`). Eine Provinz mit
# `pro_einheit = true` gibt es mehrmals, z. B. einmal pro Wohnung.
# `woerter` hilft später beim automatischen Zuordnen von Dokumenten und Beraterin-Wünschen.
#
# Das ist eine Sammelhilfe, keine Steuerberatung. Ergänzen ist ausdrücklich erwünscht.

[[provinz]]
key = "werkstatt"
name = "Werkstatt"
bereich = "Selbstständig"
frage = "selbststaendig"
woerter = ["rechnung", "beleg", "geschäftskonto", "fahrt", "arbeitszimmer", "einnahmen", "ausgaben", "eür"]
stuecke = [
  { key = "ausgangsrechnungen", name = "Ausgangsrechnungen", hinweis = "Wenn du mit FRITS schreibst: Die PDFs liegen im Ordner invoices." },
  { key = "belege", name = "Belege und Quittungen", hinweis = "Alles, was du fürs Geschäft bezahlt hast." },
  { key = "kontoauszuege", name = "Kontoauszüge Geschäftskonto", hinweis = "Am einfachsten als Jahres-Export aus dem Online-Banking." },
  { key = "fahrten", name = "Fahrten und Kilometer", hinweis = "Fahrtenbuch oder eine einfache Liste." },
  { key = "arbeitszimmer", name = "Arbeitszimmer", hinweis = "Größe und Kosten, falls du zu Hause arbeitest." },
]

