name: CI

# Pull requests only: a merged pull request was already tested, so testing main again
# after the merge would only spend the scarce free minutes twice.
on:
  pull_request:
  workflow_dispatch:

env:
  SPACY_MODEL: https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl
  # Redaction and OCR tests must run in CI, never be skipped.
  FRITS_REQUIRE_NER: "1"
  FRITS_REQUIRE_OCR: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Fritz uses a Mac. But macOS minutes count 10x on a private repo, and the free
        # monthly minutes ran low with many pull requests. So pull requests and pushes test
        # on Linux, and macOS runs when started by hand ("Run workflow"). The "Mac app"
        # workflow also starts the real app on macOS before every release.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-latest", "ubuntu-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          curl -sSL -o "$(brew --prefix)/share/tessdata/deu.traineddata" \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/deu.traineddata
      - run: uv sync --frozen --python 3.12
      - run: uv pip install "$SPACY_MODEL"
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    # Proves the dev image still builds and its tests pass inside it. The tests are the same
    # as above, so this runs only by hand ("Run workflow") or on a pull request labelled "docker"
    # (worth it when Dockerfile or dependencies change).
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'docker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frits-dev .
      - run: docker run --rm -e FRITS_REQUIRE_NER=1 -e FRITS_REQUIRE_OCR=1 --entrypoint pytest frits-dev -q
