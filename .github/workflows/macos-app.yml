name: Mac app

# Builds FRITS-macOS.zip: FRITS.app for Apple Silicon and Intel Macs, runs offline.
# Runs when the packaging changes, on every push to main, by hand ("Run workflow"),
# and for version tags (v1.0.0 ...), which also attach the zip to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/macos/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Install micromamba (fetches Tesseract for both chip types)
        run: brew install micromamba

      - name: Build FRITS.app
        run: packaging/macos/build.sh

      - name: Unpack like a user would
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          ditto -x -k dist/macos/FRITS-macOS.zip "$RUNNER_TEMP/try"
          ls -la "$RUNNER_TEMP/try/FRITS"

      - name: Check it starts, with no internet and no outside Python
        run: |
          RES="$RUNNER_TEMP/try/FRITS/FRITS.app/Contents/Resources"
          NO_NET='(version 1)(allow default)(deny network*)'
          check() {
            env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              sandbox-exec -p "$NO_NET" "$@"
          }
          check "$RES/bin/frits" --version
          check "$RES/bin/frits" --help
          # The German model must load and find the person and the city.
          check env PYTHONPATH="$RES/shared" PYTHONNOUSERSITE=1 \
            "$RES/runtime/arm64/bin/python3" -c '
          import spacy
          nlp = spacy.load("de_core_news_lg")
          ents = {(e.text, e.label_) for e in nlp("Herr Fritz Müller wohnt in Berlin.").ents}
          print(ents)
          assert ("Berlin", "LOC") in ents, ents
          '
          # Tesseract must read German text from a picture.
          printf 'Rechnung für Herrn Müller\nGrößenänderung der Straße\n' > "$RUNNER_TEMP/ocr.txt"
          cupsfilter "$RUNNER_TEMP/ocr.txt" > "$RUNNER_TEMP/ocr.pdf" 2>/dev/null
          sips -s format png -Z 2400 "$RUNNER_TEMP/ocr.pdf" --out "$RUNNER_TEMP/ocr.png" >/dev/null
          TESS="$RES/tesseract/arm64/bin/tesseract"
          check env TESSDATA_PREFIX="$RES/tessdata" "$TESS" --list-langs
          check env TESSDATA_PREFIX="$RES/tessdata" "$TESS" "$RUNNER_TEMP/ocr.png" - -l deu | tee "$RUNNER_TEMP/ocr.out"
          grep -q "Rechnung" "$RUNNER_TEMP/ocr.out"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            check arch -x86_64 env TESSDATA_PREFIX="$RES/tessdata" \
              "$RES/tesseract/x86_64/bin/tesseract" "$RUNNER_TEMP/ocr.png" - -l deu | grep "Rechnung"
            echo "Intel version (via Rosetta):"
            check arch -x86_64 env PYTHONPATH="$RES/shared" PYTHONNOUSERSITE=1 \
              "$RES/runtime/x86_64/bin/python3" -c '
          import platform, spacy
          print(platform.machine())
          spacy.load("de_core_news_lg")
          print("model ok")
          '
          else
            echo "Rosetta not available on this runner; skipping the Intel check."
          fi

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: FRITS-macOS
          path: dist/macos/FRITS-macOS.zip
          compression-level: 0
          # The zip is about 730 MB; keep it briefly so it does not fill the storage allowance.
          retention-days: 3

      - name: Attach zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "FRITS $GITHUB_REF_NAME" --notes "Mac version: download FRITS-macOS.zip, unzip, read LIESMICH.txt."
          gh release upload "$GITHUB_REF_NAME" dist/macos/FRITS-macOS.zip --clobber
