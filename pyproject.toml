[project]
name = "frits"
version = "1.2.0"
description = "FRITS - Fantastisches Rechnungsschreibungs IT-System: drop a note, get an invoice draft, with local PII redaction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "factur-x>=3.6",
    "fastapi>=0.162.0",
    "fpdf2>=2.8",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "openai>=3.42.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "pyzipper>=0.3.6",
    "spacy>=3.8,<4",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
frits = "frits.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
    "saxonche>=13.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frits"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
