[project]
name = "frits"
version = "0.1.0"
description = "FRITS - Fantastisches Rechnungsschreibungs IT-System: drop a note, get an invoice draft, with local PII redaction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pypdf>=6.21.4",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "spacy>=3.8,<4",
]

[project.scripts]
frits = "frits.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frits"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
